<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAACK · Trend Detective</title>
    <!--
      Front door of the repository when GitHub Pages publishes it from the main branch, folder / (root):
      it sends the visitor to the built site, which lives in site/. The address keeps whatever came
      after it (?lang=es, #w-verdict…). Written with AI assistance (Claude) for team RAACK.
    -->
    <meta name="description" content="Trend Detective, team RAACK · NASA Space Apps Challenge 2026. Opening the site…" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />
    <link rel="canonical" href="site/" />
    <script>
      location.replace('site/' + location.search + location.hash);
    </script>
    <!-- Without scripts: the same trip, one second later. -->
    <noscript><meta http-equiv="refresh" content="1; url=site/" /></noscript>
    <style>
      html {
        color-scheme: light dark;
        background: #f9f9f7;
        color: #0b0b0b;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0d0d0d;
          color: #f0efec;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      a {
        color: inherit;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <p><a href="site/">Open Trend Detective →</a></p>
  </body>
</html>
